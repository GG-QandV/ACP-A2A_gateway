# ПЕРЕИМЕНОВАН: name = "core" конфликтовал со встроенным crate `core`
# из extern prelude -> error[E0659]: `core` is ambiguous в gatewayd.
[package]
name = "gateway-core"
version = "0.1.0"
edition = "2021"

[lib]
name = "gateway_core"
path = "src/lib.rs"

[dependencies]
protocol = { path = "../protocol" }
tokio = { workspace = true }
async-trait = { workspace = true }
anyhow = { workspace = true }
thiserror = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }  # ДОБАВЛЕНО (аудит P2-10): супервизор логирует перезапуски
chrono = { version = "0.4", features = ["clock"] }
reqwest = { version = "0.12", features = ["json", "stream"] }

[dev-dependencies]
tempfile = "3"

# ПЕРЕИМЕНОВАН: name = "core" конфликтовал со встроенным crate `core`
# из extern prelude -> error[E0659]: `core` is ambiguous в gatewayd.
[package]
name = "gateway-core"
version = "1.0.2"
edition = "2021"

[lib]
name = "gateway_core"
path = "src/lib.rs"

[dependencies]
protocol = { path = "../protocol" }
tokio = { workspace = true }
async-trait = { workspace = true }
anyhow = { workspace = true }
thiserror = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }  # ДОБАВЛЕНО (аудит P2-10): супервизор логирует перезапуски
chrono = { version = "0.4", features = ["clock"] }
reqwest = { version = "0.12", features = ["json", "stream"] }
futures-util = "0.3"  # ДОБАВЛЕНО (T4): StreamExt для SSE-клиента
hmac = "0.12"         # ДОБАВЛЕНО (HMAC токена)
sha2 = "0.10"         # ДОБАВЛЕНО (HMAC токена)

[dev-dependencies]
tempfile = "3"
filetime = "0.2"  # тестам нужно состарить файл, чтобы проверить уборку
axum = "0.7"      # ДОБАВЛЕНО (T4): mock SSE-сервер для HttpA2aAgent
tower = { version = "0.4", features = ["util"] }

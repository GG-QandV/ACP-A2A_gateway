[package]
name = "gatewayd"
version.workspace = true
edition.workspace = true

[[bin]]
name = "gatewayd"
path = "src/main.rs"

# Test ACP agent for the E2E harness of integration tests
# (gatewayd/tests/rest_transport.rs). Its own binary, not production:
# the path is injected into Registry via CARGO_BIN_EXE_mock_acp_agent.
[[bin]]
name = "mock_acp_agent"
path = "src/bin/mock_acp_agent.rs"

[dependencies]
protocol = { path = "../protocol" }
gateway-core = { path = "../core" }
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
serde_yaml = "0.9"
anyhow = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { version = "0.3", features = ["env-filter", "registry", "fmt"] }
axum = "0.7"
reqwest = { version = "0.12", features = ["json", "stream"] }
dashmap = { workspace = true }
uuid = { workspace = true }
tokio-stream = "0.1"
futures-util = "0.3"
tracing-appender = "0.2"
# Streaming roadmap Part 4 (4.4): gzip compression of rotated
# log files when compress_rotated: true.
flate2 = "1"
# Buffer config Phase 1: durable event_log/task_store. bundled — own
# static sqlite3, independent of the system library (robustness).
rusqlite = { version = "0.31", features = ["bundled"] }

[dev-dependencies]
tempfile = "3"
tower = { version = "0.4", features = ["util"] }
reqwest = { version = "0.12", features = ["json"] }

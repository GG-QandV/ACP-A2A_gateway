# config.loc.buffer.yaml — local buffer config (Phase 1).
# Working gateway config for development/local launch of streaming
# with a durable event buffer. On top of the base sections (like config.example.yaml)
# it includes event_log + task_store on SQLite.
#
# Run: gatewayd config.loc.buffer.yaml
# Post-start check: ls -la /tmp/gateway/ → event_log.db, task_store.db

listen: "0.0.0.0:8347"
http_listen: "0.0.0.0:8348"

tokens:
  - "t-dev-local-001"
  - "t-hermes-001"

agents:
  claurst-main:
    transport: stdio
    command: ["claurst", "acp"]
    cwd: "."
  hermes:
    transport: stdio
    command: ["hermes", "acp"]
    cwd: "."
    streaming:
      first_chunk_timeout_secs: 90
      idle_chunk_timeout_secs: 120

public_url: "http://localhost:8348"

task_store_dir: "/tmp/gateway/tasks"
task_retention_days: 7
turn_lease_timeout_secs: 30
agent_call_timeout_secs: 120


# --- Buffer config (Phase 1) ---

# Durable stream-event buffer: source of truth for tasks/resubscribe (T4).
# Each A2aEvent/StreamEvent is written with a monotonic seq (per task) into sqlite.
event_log:
  enabled: true
  storage_backend: sqlite
  storage_path: /tmp/gateway/event_log.db
  max_size_mb: 100

# Durable task storage. enabled: true switches from the file-based
# TaskStore (core/src/task_store.rs) to sqlite.
task_store:
  enabled: true
  storage_backend: sqlite
  storage_path: /tmp/gateway/task_store.db
  max_size_mb: 500

# --- Phase 5: journal + health monitoring ---

# Durable event journal for the user: health alerts, stream drops,
# approvals. One background writer task, self-cleanup by retention_days and
# max_size_mb. Viewing — later via a CLI module (not through external sqlite3).
journal:
  enabled: true
  storage_backend: sqlite
  storage_path: /tmp/gateway/journal.db
  max_size_mb: 100
  retention_days: 30

# Health monitoring: periodic summary of DB sizes (event_log,
# task_store, journal) and stream slot occupancy. Alerts on DB
# occupancy are written to the journal + tracing; summary — every check_interval_secs.
health:
  enabled: true
  check_interval_secs: 300
  db_size_warn_pct: 80

# --- Phase 7: agent approvals via CLI ---

# Human control over whom the gateway serves. A new agent from
# config.yaml lands in pending status and is NOT started until approved:
#   gatewayd --approvals          # list statuses
#   gatewayd --approve <name>     # approve
#   gatewayd --reject <name>      # reject
# If the agent's command/cwd/url changes — re-approval is required.
approvals:
  enabled: true
  storage_path: /tmp/gateway/approvals.db
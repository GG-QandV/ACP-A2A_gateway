# config.example.yaml — full example. The gateway brings up two transports:
# TCP (ACP clients, directions 1 and 3) and HTTP (A2A clients, directions 2 and 4).

listen: "0.0.0.0:8347"        # TCP: ACP client -> {ACP agent | A2A agent}
http_listen: "0.0.0.0:8348"   # HTTP: A2A client -> {ACP agent | A2A agent}

tokens:
  - "t-dev-local-001"
  - "t-dev-local-002"

agents:
  claurst-main:
    transport: stdio
    command: ["claurst", "acp"]
    cwd: "/srv/workspaces/main"
    env:
      OPENMODEL_API_KEY: "{env:OPENMODEL_API_KEY}"

  opencode-local:
    transport: stdio
    command: ["opencode", "acp"]
    cwd: "/srv/workspaces/opencode"

  ops-agent:
    transport: http
    url: "https://ops.internal/a2a"
    push_token: "{env:OPS_AGENT_PUSH_TOKEN}"

# Gateway external address — goes into AgentCard.url (agent.json).
# Must be the address where the gateway is visible to clients from outside,
# not the bind address: behind a reverse-proxy this is the proxy's domain.
public_url: "https://gateway.example.com"

# Streaming roadmap Part 4: logging and rotation.
#   level:  info | debug | trace | warn | error | off  (off = emergency valve,
#           disables the filter entirely; log-based diagnostics become unavailable)
#   output: stdout | file | both
#   debug_ttl_minutes: lifetime of a temporarily raised level (debug|trace)
#           via POST /debug/level — auto-returns to "info" on expiry.
#           Token check: same Authorization: Bearer <token> as the RPC.
#   file:   paths and rotation (relevant for output: file|both).
#           max_total_size_mb — directory ceiling; the monitor hourly actually
#           gzip-compresses and deletes the oldest files when it is exceeded.
#           compress_rotated: true — compress rotated files during cleanup.
logging:
  level: "info"
  output: "stdout"
  debug_ttl_minutes: 60
  file:
    path: "/var/log/acp-a2a-gateway/gateway.log"
    max_file_size_mb: 100
    max_files: 10
    max_total_size_mb: 1000
    compress_rotated: true

task_store_dir: "/tmp/gateway/tasks"
task_retention_days: 7        # completed tasks are reaped in the background hourly
turn_lease_timeout_secs: 30
agent_call_timeout_secs: 120   # ADDED (audit P2-11): was hardcoded to 60s in stdio_agent.rs

# Usage (after starting gatewayd config.yaml):
#
# 1) ACP client -> claurst-main (ACP, passthrough):
#    tcp connect 0.0.0.0:8347, first line:
#    {"token":"t-dev-local-001","agent_id":"claurst-main"}
#
# 2) ACP client -> ops-agent (A2A, via converter):
#    tcp connect 0.0.0.0:8347, first line:
#    {"token":"t-dev-local-001","agent_id":"ops-agent"}
#    then regular ACP JSON-RPC (initialize/session/new/session/prompt).
#
# 3) A2A client -> claurst-main (ACP, via converter):
#    GET  http://0.0.0.0:8348/agents/claurst-main/.well-known/agent.json
#    POST http://0.0.0.0:8348/agents/claurst-main/rpc
#    Authorization: Bearer t-dev-local-001
#    {"jsonrpc":"2.0","id":1,"method":"message/send","params":{"message":{...}}}
#
# 4) A2A client -> ops-agent (A2A, reverse-proxy without converter):
#    POST http://0.0.0.0:8348/a2a-proxy/ops-agent/rpc
#    Authorization: Bearer t-dev-local-001
#    Body and query string go upstream as-is (including the SSE stream).
#    For a stdio agent via /a2a-proxy this returns 400.
#
# Conversations (contextId):
#   The message/send response contains contextId. Resending it in the next
#   request, the client continues the same conversation; without it a new one starts.
#   A conversation is bound to a token: another token's contextId is rejected.
#   Idle conversations are evicted after 24 hours.
#
# Agent restart:
#   If the agent process dies, the gateway spawns a new one (at most once per 5
#   seconds). Conversations started before the restart are lost: accessing
#   such a contextId returns a JSON-RPC error with code -32010 and HTTP 409.
#   On receiving it, the client must start the conversation over — a repeat request
#   with the same contextId will create a fresh session.
#
# Response codes when the agent has problems:
#   404 / -32601  — no such agent_id in the registry (typo; retrying won't help)
#   400 / -32602  — agent_id is configured as http/A2A, it needs /a2a-proxy
#   503 / -32020  — agent is configured but won't come up; the request is worth retrying
#   409 / -32010  — context lost (agent was restarted), start the conversation over
#
# ACP clients (TCP, direction 3):
#   session/prompt requires a sessionId created via session/new —
#   an arbitrary identifier is rejected. Close sessions via
#   session/cancel; unclosed ones are evicted after 24 hours, the ceiling is 256
#   concurrent sessions per connection.
#
# TLS:
#   The gateway listens over HTTP and does not terminate TLS itself — this is deliberate.
#   It must not be exposed directly to an untrusted network: tokens would travel
#   in cleartext. Put a reverse-proxy (nginx, Caddy,
#   Traefik) with certificates and, if needed, rate limiting —
#   the gateway does not implement those either.

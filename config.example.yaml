# config.example.yaml — v2: добавлен http_listen для четвёртого направления
# (A2A-клиент -> ACP-агент, gatewayd/src/transport_http.rs).

listen: "0.0.0.0:8347"        # TCP: ACP-клиент -> {ACP-агент | A2A-агент}
http_listen: "0.0.0.0:8348"   # HTTP: A2A-клиент -> ACP-агент

tokens:
  - "t-dev-local-001"
  - "t-dev-local-002"

agents:
  claurst-main:
    transport: stdio
    command: ["claurst", "acp"]
    cwd: "/srv/workspaces/main"
    env:
      OPENMODEL_API_KEY: "{env:OPENMODEL_API_KEY}"

  opencode-local:
    transport: stdio
    command: ["opencode", "acp"]
    cwd: "/srv/workspaces/opencode"

  ops-agent:
    transport: http
    url: "https://ops.internal/a2a"
    push_token: "{env:OPS_AGENT_PUSH_TOKEN}"

# Внешний адрес шлюза — попадает в AgentCard.url (agent.json).
# Должен быть тем адресом, по которому шлюз виден клиентам снаружи,
# а не адресом привязки: за reverse-proxy это домен прокси.
public_url: "https://gateway.example.com"

task_store_dir: "/tmp/gateway/tasks"
task_retention_days: 7        # завершённые задачи убираются фоном раз в час
turn_lease_timeout_secs: 30
agent_call_timeout_secs: 120   # ДОБАВЛЕНО (аудит P2-11): было захардкожено 60s в stdio_agent.rs

# Использование (после запуска gatewayd config.yaml):
#
# 1) ACP-клиент -> claurst-main (ACP, passthrough):
#    tcp connect 0.0.0.0:8347, первая строка:
#    {"token":"t-dev-local-001","agent_id":"claurst-main"}
#
# 2) ACP-клиент -> ops-agent (A2A, через конвертер):
#    tcp connect 0.0.0.0:8347, первая строка:
#    {"token":"t-dev-local-001","agent_id":"ops-agent"}
#    далее обычный ACP JSON-RPC (initialize/session/new/session/prompt).
#
# 3) A2A-клиент -> claurst-main (ACP, через конвертер):
#    GET  http://0.0.0.0:8348/agents/claurst-main/.well-known/agent.json
#    POST http://0.0.0.0:8348/agents/claurst-main/rpc
#    Authorization: Bearer t-dev-local-001
#    {"jsonrpc":"2.0","id":1,"method":"message/send","params":{"message":{...}}}
#
# Разговоры (contextId):
#   Ответ на message/send содержит contextId. Переслав его в следующем
#   запросе, клиент продолжает тот же разговор; без него начинается новый.
#   Разговор закреплён за токеном: чужой contextId отклоняется.
#   Простаивающие разговоры выселяются через 24 часа.
#
# Перезапуск агента:
#   Если процесс агента умирает, шлюз поднимает новый (не чаще раза в 5
#   секунд). Разговоры, начатые до перезапуска, теряются: обращение к
#   такому contextId возвращает JSON-RPC error с кодом -32010 и HTTP 409.
#   Получив его, клиент должен начать разговор заново — повторный запрос
#   с тем же contextId уже создаст свежую сессию.
#
# Коды ответов при проблемах с агентом:
#   404 / -32601  — такого agent_id нет в реестре (опечатка, повтор не поможет)
#   400 / -32602  — agent_id настроен как http/A2A, для него нужен /a2a-proxy
#   503 / -32020  — агент настроен, но не поднимается; запрос имеет смысл повторить
#   409 / -32010  — контекст потерян (агент был перезапущен), начните разговор заново
#
# ACP-клиенты (TCP, направление 3):
#   session/prompt требует sessionId, заведённого через session/new —
#   произвольный идентификатор отклоняется. Закрывайте сессии через
#   session/cancel; незакрытые выселяются через 24 часа, потолок — 256
#   одновременных сессий на соединение.
#
# TLS:
#   Шлюз слушает по HTTP и не терминирует TLS сам — это сознательно.
#   Выставлять его напрямую в недоверенную сеть нельзя: токены пойдут
#   открытым текстом. Ставьте перед ним reverse-proxy (nginx, Caddy,
#   Traefik) с сертификатами и, при необходимости, rate limiting —
#   их шлюз тоже не реализует.

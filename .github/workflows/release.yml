name: release

# Each job builds one explicit Rust target. macOS x86_64 is cross-built on the
# arm64 runner (the macOS SDK ships both slices) because GitHub retired the
# Intel `macos-13` runner. Windows/macOS need no OpenSSL: native-tls resolves to
# schannel / Security.framework (verified with `cargo tree --target ... -i openssl-sys`).

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to (re)build and attach assets for, e.g. v1.1.2"
        required: true
        type: string

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: build ${{ matrix.slug }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            slug: linux-x86_64
            exe: gatewayd
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            slug: windows-x86_64
            exe: gatewayd.exe
          - os: macos-14
            target: aarch64-apple-darwin
            slug: darwin-arm64
            exe: gatewayd
          - os: macos-14
            target: x86_64-apple-darwin
            slug: darwin-x86_64
            exe: gatewayd
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build release binary
        run: cargo build --release --locked --target ${{ matrix.target }} -p gatewayd --bin gatewayd

      - name: Resolve tag
        id: tag
        run: |
          if [ -n "${{ inputs.tag }}" ]; then
            echo "tag=${{ inputs.tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          fi

      - name: Stage asset + checksum
        id: stage
        env:
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          set -euo pipefail
          src="target/${{ matrix.target }}/release/${{ matrix.exe }}"
          test -f "$src" || { echo "нет $src"; find target -maxdepth 3 -name '${{ matrix.exe }}' ; exit 1; }
          asset="gatewayd-${TAG}-${{ matrix.slug }}"
          cp "$src" "$asset"
          # python is present on all runner images -> portable sha256
          python3 - "$asset" <<'PY' > "$asset.sha256"
          import hashlib, sys
          p = sys.argv[1]
          h = hashlib.sha256(open(p, "rb").read()).hexdigest()
          print(f"{h}  {p}")
          PY
          echo "asset=$asset" >> "$GITHUB_OUTPUT"
          echo "sha256=$(awk '{print $1}' "$asset.sha256")" >> "$GITHUB_OUTPUT"
          cat "$asset.sha256"

      - name: Create the release if it does not exist yet
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          gh release view "$TAG" >/dev/null 2>&1 \
            || gh release create "$TAG" --target "$GITHUB_SHA" --title "$TAG" \
                 --notes "Prebuilt gatewayd binaries. See INSTALL.md for the three install paths."

      - name: Upload asset
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.tag.outputs.tag }}
        run: gh release upload "$TAG" "${{ steps.stage.outputs.asset }}" "${{ steps.stage.outputs.asset }}.sha256" --clobber

  universal:
    name: macos universal binary
    needs: build
    runs-on: macos-14
    defaults:
      run:
        shell: bash
    steps:
      - name: Resolve tag
        id: tag
        run: |
          if [ -n "${{ inputs.tag }}" ]; then
            echo "tag=${{ inputs.tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          fi
      - name: Download the two darwin assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          gh release download "$TAG" -p "gatewayd-${TAG}-darwin-arm64" -p "gatewayd-${TAG}-darwin-x86_64" -D dl
      - name: lipo + upload
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          set -euo pipefail
          out="gatewayd-${TAG}-darwin-universal"
          lipo -create "dl/gatewayd-${TAG}-darwin-arm64" "dl/gatewayd-${TAG}-darwin-x86_64" -output "$out"
          lipo -archs "$out"
          python3 - "$out" <<'PY' > "$out.sha256"
          import hashlib, sys
          p = sys.argv[1]
          print(f"{hashlib.sha256(open(p,'rb').read()).hexdigest()}  {p}")
          PY
          gh release upload "$TAG" "$out" "$out.sha256" --clobber

  summary:
    name: asset summary
    needs: [build, universal]
    if: always()
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    steps:
      - name: List assets on the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="${{ inputs.tag || github.ref_name }}"
          echo "### Assets on \`$tag\`" >> "$GITHUB_STEP_SUMMARY"
          gh release view "$tag" --json assets,name,isDraft \
            --jq '"release: \(.name) (draft=\(.isDraft))", (.assets[] | "- `\(.name)` — \(.size) bytes")' \
            >> "$GITHUB_STEP_SUMMARY" || true

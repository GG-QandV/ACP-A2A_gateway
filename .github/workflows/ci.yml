name: ci

# Manual runs only (owner's decision 2026-10-24: Actions quota). Start it from the
# Actions tab or `gh workflow run ci.yml`; pushes and pull requests do not trigger it.
on:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: fmt + clippy + test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-14]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Format
        if: matrix.os == 'ubuntu-latest'
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Test
        # whole workspace on purpose: the stdio_agent tests spawn
        # target/debug/mock_acp_agent, which a `-p gateway-core --lib` run never builds
        run: cargo test --workspace --locked
